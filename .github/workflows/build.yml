name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compiler l'APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk AppareillageAuditif.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AppareillageAuditif-apk
          path: AppareillageAuditif.apk

      - name: Publier la dernière version
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-${{ github.ref_name }}
          name: Dernière version (${{ github.ref_name }})
          prerelease: true
          make_latest: false
          files: AppareillageAuditif.apk
          body: |
            APK à installer directement sur le téléphone Android (8.0 ou plus récent).
            Commit ${{ github.sha }}
